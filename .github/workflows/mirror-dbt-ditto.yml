name: mirror dbt-ditto

# The dbt package hub indexes repositories whose dbt_project.yml sits at the
# repository root, and this repository's root is a Go module. So the hub listing
# is served from rognerud/dbt_ditto, which is this directory and nothing else,
# pushed there on every release.
#
# The underscore is not a typo and is not cosmetic. dbt packages are named with
# underscores, which is what a user writes in packages.yml; and the mirror
# cannot be called `rognerud/dbt-ditto`, because that is this repository.
#
# One-time setup:
#   1. Create an empty public repo `rognerud/dbt_ditto`.
#   2. Create a PAT (fine-grained, Contents: read and write on that repo only)
#      and add it here as the secret MIRROR_TOKEN. The default GITHUB_TOKEN
#      cannot push to another repository.
#   3. After the first successful run, open a PR against dbt-labs/hubcap adding
#      "rognerud": ["dbt_ditto"] to hub.json.
#
# Indexing is hourly after that, so later releases need nothing but a tag.

# Called by release.yml rather than triggered by the tag. GitHub creates the tag
# when the draft release is published, using its own token, and a tag pushed
# that way does not fire `on: push: tags` — so a tag-triggered mirror would
# silently never run.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to mirror (must already exist)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to mirror (must already exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: check out dbt-ditto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: the package version must match the tag
        run: ./scripts/check-versions.sh "${{ inputs.tag }}"

      - name: check out the mirror
        uses: actions/checkout@v4
        with:
          repository: rognerud/dbt_ditto
          token: ${{ secrets.MIRROR_TOKEN }}
          path: mirror
          fetch-depth: 0

      - name: copy the package to the mirror root
        run: |
          # Replace the tree wholesale rather than merging: the mirror is a
          # derived artefact, and a file deleted here has to disappear there.
          find mirror -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R packaging/dbt-ditto/. mirror/
          # The package is MIT-licensed with the rest of the repository, and the
          # hub review looks for the licence in the repository it indexes.
          if [[ -f LICENSE ]]; then cp LICENSE mirror/LICENSE; fi

      - name: commit and tag
        working-directory: mirror
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change to mirror"
          else
            git commit -m "dbt-ditto ${TAG}" \
                       -m "Mirrored from rognerud/dbt-ditto@${GITHUB_SHA}."
            git push origin HEAD:main
          fi
          # The hub takes its versions from git tags, so the tag is the release.
          git tag -f "${TAG}"
          git push -f origin "refs/tags/${TAG}"
