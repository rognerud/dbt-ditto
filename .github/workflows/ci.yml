name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Go suite needs no dbt, no Python and no warehouse, so it runs on both
  # platforms the binary ships for.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "${unformatted}" ]]; then
            echo "not gofmt'd:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
        shell: bash

      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/dbt-ditto ./cmd/dbt-ditto

  # Its own job so a failure reads as "this behaviour changed" rather than as one
  # line in the middle of the suite.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/features/ -v

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: python syntax
        run: python3 -m compileall -q packaging scripts

  # The providers are Python. No warehouse is reached: this covers the contract,
  # profiles.yml resolution and adapter type rendering. That dbt-ditto and a
  # provider agree about the wire format is proved in Go, above.
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: ./scripts/providers.sh

  # The real dbt-osmosis against dbt-ditto. `go test` replays the recorded
  # result; only this catches dbt-osmosis changing under us.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: ./scripts/parity.sh --check
