name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor

jobs:
  # Nothing is published until the tag, the wheel version and the dbt package
  # version agree and the suite passes. A release that ships three different
  # version numbers cannot be un-published from PyPI.
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - id: tag
        run: echo "tag=${TAG:-${GITHUB_REF_NAME}}" >>"${GITHUB_OUTPUT}"
        env:
          TAG: ${{ inputs.tag }}

      - run: ./scripts/check-versions.sh "${{ steps.tag.outputs.tag }}"
      - run: go test ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both of these cross-compile every target from this one runner: no cgo,
      # one pure-Go dependency.
      - name: archives
        run: VERSION="${{ needs.verify.outputs.tag }}" ./scripts/dist.sh

      - name: wheels
        run: python3 packaging/pypi/build_wheels.py --version "${{ needs.verify.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/pypi/*.whl
          if-no-files-found: error

  # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is
  # no API token to store or leak. Configure it once at
  # https://pypi.org/manage/project/dbt-ditto/settings/publishing/ with
  # workflow `release.yml` and environment `pypi`.
  pypi:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbt-ditto
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: dist

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*
