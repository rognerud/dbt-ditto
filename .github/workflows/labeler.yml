name: labeler

# Keeps the repository's labels matching .github/labels.yml. release-drafter
# reads them for both the notes section and the version bump, so a label created
# by hand drifts from the resolver that depends on it.

on:
  push:
    branches: [main]
    paths: [".github/labels.yml", ".github/workflows/labeler.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          # Labels are added and updated, never deleted: a label somebody made
          # for their own triage is not this file's business to remove.
          skip-delete: true
