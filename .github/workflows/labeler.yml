name: labeler

# Keeps the repository's labels matching .github/labels.yml. release-drafter
# reads them for both the notes section and the version bump, so a label created
# by hand drifts from the resolver that depends on it.

on:
  push:
    branches: [main]
    paths: [".github/labels.yml", ".github/workflows/labeler.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: sync labels
        uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916 # v5.0.0
        with:
          yaml-file: .github/labels.yml
          # Labels are added and updated, never deleted: a label somebody made
          # for their own triage is not this file's business to remove.
          skip-delete: true
