name: labeler

# Keeps the repository's labels matching .github/labels.yml.
#
# The labels are not decoration: release-drafter reads them to decide both the
# section of the release notes a pull request lands in and how the version is
# bumped. Creating them by hand in the web interface means they drift from the
# resolver that depends on them, and a typo'd label silently becomes a patch.

on:
  push:
    branches: [main]
    paths: [".github/labels.yml", ".github/workflows/labeler.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: sync labels
        uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916 # v5.0.0
        with:
          yaml-file: .github/labels.yml
          # Labels are added and updated, never deleted: a label somebody made
          # for their own triage is not this file's business to remove.
          skip-delete: true
