name: pages

# Publishes docs/index.html as the project's landing page.
#
# There is no site generator: the page is one hand-written HTML file and its
# logo, so the "build" is a copy. The Markdown in docs/ is deliberately left
# behind — it links to source files by relative path and reads correctly on
# GitHub, which is where the page sends people for it.

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deploys serialise against each other, and cancelling one halfway would leave
# the site mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/index.html _site/
          cp -r docs/assets _site/assets

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
