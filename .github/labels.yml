# The labels release-drafter reads. A pull request's label decides both which
# section of the notes it lands in and how the version is bumped, so these are
# part of the release machinery rather than decoration — which is why they are
# in the repository and synced by labeler.yml instead of being created by hand
# in the web interface and drifting.
#
# The three that move the version are `breaking` (major), `enhancement` and
# `removal` (minor). Everything else is a patch, as is a PR with no label at all.

- name: breaking
  color: "b60205"
  description: "Changes behaviour someone may be relying on (major)"

- name: enhancement
  color: "0e8a16"
  description: "New capability (minor)"

- name: removal
  color: "d93f0b"
  description: "Removes or deprecates something (minor)"

- name: bug
  color: "d73a4a"
  description: "Something was wrong (patch)"

- name: performance
  color: "fbca04"
  description: "Same answer, less time or memory (patch)"

- name: documentation
  color: "0075ca"
  description: "README, .agents/, or comments (patch)"

- name: refactoring
  color: "c5def5"
  description: "Same behaviour, better shape (patch)"

- name: testing
  color: "bfd4f2"
  description: "Tests and fixtures (patch)"

- name: ci
  color: "5319e7"
  description: "Workflows, hooks and scripts (patch)"

- name: build
  color: "5319e7"
  description: "Packaging and distribution (patch)"

- name: dependencies
  color: "0366d6"
  description: "Dependency bumps (patch)"

- name: skip-changelog
  color: "ededed"
  description: "Left out of the release notes entirely"
